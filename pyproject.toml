[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uniskill"
version = "2026.1.0"
description = "UniSkill: Sovereign Autonomous Skill Manager, Dynamic 100% Convergence Engine & Token Economizer for Antigravity"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Shoeb Ahmad", email = "founder@uniai.local" }
]
license = { text = "MIT" }
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "pydantic>=2.7.0",
]

[project.scripts]
uniskill = "uniskill.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
